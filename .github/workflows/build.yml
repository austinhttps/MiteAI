name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore MiteAI.slnx

    - name: Build Solution
      run: dotnet build MiteAI.slnx --no-restore --configuration Release

    - name: Run xUnit Tests
      run: dotnet test tests/MiteAI.Tests/MiteAI.Tests.csproj --no-build --configuration Release --verbosity normal
